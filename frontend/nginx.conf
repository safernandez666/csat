# Apex domain — serves the under-construction landing for the company site.
# Anything matching the bare domain (no subdomain) gets the static page.
# Note: server_name is exact-match; the catch-all default_server below
# handles everything else (admin, tenant subdomains).
server {
    listen 80;
    server_name zebrasecurity.io;
    root /usr/share/nginx/html;
    location = / {
        try_files /under-construction.html =404;
    }
    location / {
        # Fall back to the same page for any sub-path on apex — we don't host
        # anything else there for now.
        try_files $uri /under-construction.html;
    }
}

# Default server — admin plane + tenant subdomains. The SPA + API proxies.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend SPA routing
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets (JS/CSS with content hash)
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # API proxy to backend.
    # Authenticated, per-tenant responses must never be cached by any
    # intermediary — explicit no-store overrides any default behavior in
    # CDNs, browsers, or proxies. Pair with a Cloudflare cache rule that
    # bypasses /api/* at the edge for defense in depth.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
    }

    # AI endpoints can run long inference on local CPU — extend timeouts
    location /api/ai/ {
        proxy_pass http://backend:8000/api/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Uploads proxy to backend.
    # Per-tenant evidence files — same no-cache rules as /api/ to prevent
    # any tenant's file from being served to another tenant via shared cache.
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
    }

    # Health check.
    # In SaaS mode TenantMiddleware reads the Host header to route. Without
    # `proxy_set_header Host $host` nginx forwards Host: backend (no dot)
    # and the middleware rejects it as 404. Preserving the original host
    # lets external monitors hitting <admin>.csat.<domain>/health succeed,
    # while bare-IP probes still 404 (intentional — backend stays invisible
    # to un-routed traffic).
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }
}
